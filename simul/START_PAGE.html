<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>NightSky Start Page</title>
	<link id='nsfontst' rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap">
	<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script> 
</head>
<body>
<style>
	body
	{
		background: black;
		background-image: url("https://picsum.photos/1280/720?random=12");
		background-size: 100% 100vh;
	}
	#maindiv
	{
		display: flex;
		position: fixed;
		top:0px;
		left:0px;
		width: 100%;
		height: 100%;
		background: rgba(0,0,0,0.6);
		backdrop-filter: blur(10px);
		-webkit-backdrop-filter:blur(10px);
		-moz-backdrop-filter:blur(10px);
		color:white;
		justify-content:center;
		align-items:center;
		flex-direction: column
	}
	input
	{
		font-family: Roboto,sans-serif;
		border-radius: 20px;
		width:40%;
		height:40px;
		background: rgba(255, 255, 255, 0.2);
		backdrop-filter: blur(10px);
		-webkit-backdrop-filter:blur(10px);
		-moz-backdrop-filter:blur(10px);
		color:white;
		padding-top:10px;
		padding-left:20px;
		padding-bottom:10px;
		font-size: 25px;
		border-width: 0px;
		outline:none;
		box-shadow: 0px 0px 25px 0px black;
	}
	#hoverdiv
	{
		margin-top: 10px;
		width:40%;
		border-radius: 10px;
		background: rgba(255, 255, 255, 0.2);
		backdrop-filter: blur(10px);
		-webkit-backdrop-filter:blur(10px);
		-moz-backdrop-filter:blur(10px);
		color:white;
		padding:15px;
		box-shadow: 0px 0px 25px 0px black;
	}
	.linktext
	{
		transition:color 0.3s;
	}
	.linktext:hover
	{
		color:rgba(255,255,255,0.7);
	}
</style>
<div id="maindiv">
<h1>NightSky起始页</h1>
<p id="sentence" style="width:50%;font-size:18px;">我不怕千万人阻挡，只怕自己投降。</p>
<input type="text" id="search" oninput="display_stuff(this.value)" placeholder="输入一串网址，或关键词。" />
<div id="hoverdiv" hidden></div>
<p>背景图片来源：Picsum Photos</p>
<p>Copyright &copy; Hello-Programming 2023-2026</p>
</div>
<script>
var hd = document.getElementById("hoverdiv");
if(localStorage.getItem('NS_FONT_FAMILY.nsys')){
	var Astylesheet_font = document.getElementById('nsfontst');
	Astylesheet_font.href=`https://fonts.googleapis.com/css2?family=${localStorage.getItem('NS_FONT_FAMILY.nsys')}:wght@400;700&display=swap`;
	$('button,input,select,body,textarea').css('font-family',localStorage.getItem('NS_FONT_FAMILY.nsys'));
}
else{
	console.log("No font family.")
}
fetch("https://v2.xxapi.cn/api/yiyan?type=hitokoto")
    .then(res => res.json())
    .then(datas => {sentence.innerText = `“${datas.data}”`});
function display_stuff(keywords)
{
	if(!keywords){hd.hidden = true;return;}
	else{
		hd.hidden = false;
		hd.innerHTML = `
<p class="linktext" onclick="location.href='${keywords}';">[ 直接访问 ${keywords} ]</p>
<p class="linktext" onclick="location.href='https://www.bing.com/search?q=${keywords}';">[ 必应搜索 “${keywords}” ]</p>
	`;
	}
}
</script>
</body>
</html>
